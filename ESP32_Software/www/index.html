<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banc de test — tensiomètre</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f5f6f8; color: #222; }
  h1 { font-size: 1.2rem; }
  .card { background: #fff; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { display: flex; flex-wrap: wrap; gap: .8rem; }
  .metric { flex: 1 1 120px; }
  .metric .k { font-size: .75rem; color: #777; text-transform: uppercase; }
  .metric .v { font-size: 1.3rem; font-weight: 600; }
  .warn { color: #b00; }
  button { background: #369; color: #fff; border: 0; border-radius: 6px; padding: .5rem 1rem; cursor: pointer; }
  button.sec { background: #555; }
  input, select { padding: .4rem; border-radius: 6px; border: 1px solid #ccc; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; }
  #modal .box { background: #fff; border-radius: 10px; padding: 1.2rem; max-width: 460px; margin: 1rem; }
</style>
</head>
<body>
<h1>Banc de test — dérive tensiomètre + brassard</h1>

<div class="card">
  <div class="row">
    <div class="metric"><div class="k">Firmware</div><div class="v" id="version">—</div></div>
    <div class="metric"><div class="k">Capteur ABP</div><div class="v" id="abp">—</div></div>
    <div class="metric"><div class="k">Pression</div><div class="v" id="p">—</div></div>
    <div class="metric"><div class="k">Amplitude</div><div class="v" id="amp">—</div></div>
    <div class="metric"><div class="k">Ratio forme</div><div class="v" id="ratio">—</div></div>
    <div class="metric"><div class="k">Moteur</div><div class="v" id="motor">—</div></div>
    <div class="metric"><div class="k">Vanne</div><div class="v" id="valve">—</div></div>
  </div>
</div>

<div class="card">
  <h2>Procédures</h2>
  <button onclick="start('calib')">Auto-diagnostic (avant chaque session)</button>
  <button class="sec" onclick="start('test')">Test (5 mesures)</button>
</div>

<div class="card">
  <h2>Rapport de session</h2>
  <div class="row">
    <label>Opérateur <input id="f_operator"></label>
    <label>N° série appareil <input id="f_sn"></label>
    <label>Firmware appareil <input id="f_fwdev"></label>
    <label>Température (°C) <input id="f_temp" type="number" step="0.1" value="21"></label>
  </div>
  <div class="row" style="margin-top:.6rem">
    <label>Lecture anéroïde palier
      <select id="f_mano_idx"><option>0</option><option>1</option><option>2</option></select>
      <input id="f_mano" type="number" step="0.1"> mmHg
      <button class="sec" onclick="pushValue('mano')">Enregistrer</button>
    </label>
    <label>Valeur affichée n°
      <select id="f_disp_idx"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
      <input id="f_disp" type="number" step="0.1"> mmHg
      <button class="sec" onclick="pushValue('display')">Enregistrer</button>
    </label>
    <label>ΔP Boyle (10 mL injectés)
      <input id="f_boyle" type="number" step="0.1"> mmHg
      <button class="sec" onclick="pushValue('boyle')">Calculer V</button>
    </label>
  </div>
  <button onclick="saveForm(); generateReportPDF()">Générer le rapport PDF</button>
</div>

<div id="modal"><div class="box">
  <h2 id="modal_title">Action requise</h2>
  <p id="modal_msg"></p>
  <button onclick="approve()">J'ai effectué cette action — continuer</button>
</div></div>

<script src="jspdf.umd.min.js"></script>
<script src="report.js"></script>
<script>
function el(s) { return document.querySelector(s); }
var stepTitle = '';

async function poll() {
  const s = await (await fetch('/api/status')).json();
  el('#version').textContent = s.version;
  el('#abp').textContent = s.abp ? 'Connecté ✓' : 'ABSENT ✗';
  el('#p').textContent = s.pressure.toFixed(1) + ' mmHg';
  el('#amp').textContent = s.amp.toFixed(1) + ' mmHg c-à-c';
  var rt = s.ratio.toFixed(2);
  if (s.ratio > 1.8) rt += ' ⚠ signal carré → mousse EPDM';
  el('#ratio').textContent = rt;
  el('#ratio').className = s.ratio > 1.8 ? 'v warn' : 'v';
  el('#motor').textContent = s.motor ? 'ON' : 'OFF';
  el('#valve').textContent = s.valve ? 'OUVERTE' : 'FERMÉE';
  if (s.approval) { showStepModal(s.approvalMsg); }
  setTimeout(poll, 500);
}
function showStepModal(msg) {
  el('#modal_msg').textContent = msg;
  el('#modal').style.display = 'flex';
}
function hideModal() { el('#modal').style.display = 'none'; }
function approve() { hideModal(); fetch('/api/approve', { method: 'POST' }); }
function start(which) { fetch('/api/start?procedure=' + which, { method: 'POST' }); }

async function pushValue(kind) {
  var body = {};
  if (kind === 'mano')   { body = { key: 'mano',   idx: +el('#f_mano_idx').value, value: +el('#f_mano').value }; }
  if (kind === 'display'){ body = { key: 'display',idx: +el('#f_disp_idx').value, value: +el('#f_disp').value }; }
  if (kind === 'boyle') { body = { key: 'boyle',   value: +el('#f_boyle').value }; }
  await fetch('/api/value', { method: 'POST', body: JSON.stringify(body) });
}
async function saveForm() {
  var fields = [['operator', el('#f_operator').value], ['sn', el('#f_sn').value],
                ['fwdev', el('#f_fwdev').value], ['temp', +el('#f_temp').value]];
  for (var i = 0; i < fields.length; i++) {
    await fetch('/api/value', { method: 'POST', body: JSON.stringify({ key: fields[i][0], value: fields[i][1] }) });
  }
}
poll();
</script>
</body>
</html>
